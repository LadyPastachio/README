<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Atelier Academy</title>
    <script>
      // Apply the saved theme before the app loads, so the page doesn't flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('academy:settings') || '{}');
          var a = (s && s.appearance) || {};
          var t = a.theme === 'light' || a.theme === 'dark' ? a.theme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
